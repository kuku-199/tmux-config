# Use zsh as default
set -g default-shell /bin/zsh

# Enable 256-color and true-color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- General Settings ---
set -g set-clipboard on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g mouse on
set -g status-interval 1
set -g allow-passthrough on
set -g status-position bottom

# --- Prefix Key (Ctrl+B) ---
set -g prefix C-b

# Quick Source
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Window management
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind "-"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane Resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# --- Copy Mode ---
set-window-option -g mode-keys vi

# Copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Mouse selection: drag to select, release to copy (no need to press Enter)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# 推荐的时间/日期显示插件
# set -g @plugin 'tmux-plugins/tmux-time' # 时间插件
# set -g @plugin 'tmux-plugins/tmux-open' # 快速打开文件

# --- Theming ---
# Colors
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
white="#FFFFFF"

set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"

# Status Left: 终端图标 + 用户名
# 使用嵌套条件判断实现颜色变化，避免逗号冲突
# 按下前缀键时变为黄色 (#FFD700)
set -g status-left "#[fg=#{?client_prefix,#FFD700,#A3BE8C} bold] thorn #[fg=#D8DEE9 nobold]| "

# Status Right: CPU, Mem, 时间 (不带秒), 日期 (不带星期) (4 秒更新)
set -g status-right "#[fg=${blue_muted}] #{cpu} #[fg=${cyan_soft}]  #{mem} #[fg=${gray_light}]  %H:%M #[fg=${gray_medium}]  %Y-%m-%d "

# Active Window: 青色标记
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #I:#W#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"

# Message and Borders
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green_soft}"

# Resurrect
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
